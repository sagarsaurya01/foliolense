<meta charset="utf-8">
<title>FolioLense</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: deep-green brand bar, portfolio rail on the left, ledger-style holdings table on the right, modals for Import / Reports / Account */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#eaf0ed; --ink:#15231e; --muted:#5b6a64; --line:#d8e1dd;
  --brand:#0f3d35; --brand-2:#164d43; --brand-ink:#e6f1ed; --brand-muted:#9fbfb5;
  --accent:#d9603a; --accent-ink:#ffffff; --accent-soft:#fbe4da;
  --sel:#fff1cf; --sel-line:#e9b949;
  --gain:#137a46; --loss:#c23a3a; --shadow:0 10px 30px rgba(10,40,32,.16);
  --f-display:"Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1412; --surface:#141e1b; --surface-2:#1a2723; --ink:#e2ebe7; --muted:#90a29b; --line:#27362f;
  --brand:#09231e; --brand-2:#123630; --brand-ink:#e2efea; --brand-muted:#8fb0a6;
  --accent:#ee8158; --accent-ink:#1b0d07; --accent-soft:#3b2318;
  --sel:#3a3018; --sel-line:#c99b2f;
  --gain:#4cc488; --loss:#f07b7b; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1412; --surface:#141e1b; --surface-2:#1a2723; --ink:#e2ebe7; --muted:#90a29b; --line:#27362f;
  --brand:#09231e; --brand-2:#123630; --brand-ink:#e2efea; --brand-muted:#8fb0a6;
  --accent:#ee8158; --accent-ink:#1b0d07; --accent-soft:#3b2318;
  --sel:#3a3018; --sel-line:#c99b2f;
  --gain:#4cc488; --loss:#f07b7b; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.gain{color:var(--gain)} .loss{color:var(--loss)} .mut{color:var(--muted)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--brand-muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.dark{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
.ico{background:none;border:0;padding:6px;border-radius:6px;display:grid;place-items:center;color:var(--ink)}
.ico:hover{background:var(--surface-2)}

/* top bar */
.top{background:var(--brand);color:var(--brand-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.top-in{display:flex;align-items:center;gap:16px;padding-block:9px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.logo b{color:var(--accent);font-weight:800}
.sample{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--brand-muted);color:var(--brand-muted);padding:2px 8px;border-radius:999px}
.menu{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap;align-items:center}
.menu>.dd>button,.menu>button{background:none;border:0;color:var(--brand-ink);padding:6px 10px;border-radius:6px;font-size:13px;display:flex;align-items:center;gap:5px}
.menu>.dd>button:hover,.menu>button:hover{background:var(--brand-2)}
.new{font-size:9px;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:1px 5px;border-radius:4px;letter-spacing:.04em}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:11px}
.car::after{content:"";border:4px solid transparent;border-top-color:currentColor;margin-top:4px}

/* dropdowns */
.dd{position:relative}
.panel{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:30;min-width:220px;padding:6px}
.panel.left{right:auto;left:0}
.panel .it{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;font-size:13px}
.panel .it:hover{background:var(--surface-2)}
.panel hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.panel .hd{padding:6px 10px 4px}
.blogo{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}

/* sub bar */
.sub{background:var(--surface);border-bottom:1px solid var(--line)}
.sub-in{display:flex;align-items:center;gap:12px;padding-block:9px;flex-wrap:wrap}
.famBtn{font-family:var(--f-display);font-weight:700;font-size:18px;background:transparent;border:0;padding:4px 2px;display:flex;align-items:center;gap:8px}
.fampanel{width:min(370px,calc(100vw - 32px));padding:12px;display:grid;gap:10px}
.fampanel .row{display:flex;gap:14px}
.fampanel .list{max-height:300px;overflow:auto;border-top:1px solid var(--line)}
.fampanel .list .it{border-bottom:1px solid var(--line);border-radius:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.field input,.field select,.inp{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 9px;font-size:14px;color:var(--ink);min-width:0}
.gsearch,.asearch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);min-width:0}
.gsearch{margin-left:auto;flex:0 1 320px}
.gsearch input,.asearch input{border:0;background:transparent;outline:none;min-width:0;width:100%}

/* body grid */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 110px)}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:14px}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:6px 0;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.idx{display:grid;gap:6px}
.idx div{display:flex;justify-content:space-between;font-size:13px}
.idx .nm{font-weight:600}
.plist{display:flex;flex-direction:column;gap:6px}
.pbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);padding:9px 11px;border-radius:8px;font-size:13px}
.pbtn small{color:var(--muted);font-size:11px}
.pbtn:hover{border-color:var(--brand-muted)}
.pbtn[aria-current="true"]{background:var(--sel);border-color:var(--sel-line);font-weight:600}
.pbtn .who{display:flex;flex-direction:column;gap:1px;min-width:0}
.addp{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 2px;font-weight:600;color:var(--accent);font-size:13px}
.plus{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px;line-height:1}
.rail .reset{margin-top:auto;border:0;background:none;color:var(--muted);font-size:12px;text-align:left;padding:0;text-decoration:underline}

/* main */
.main{padding-block:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phead h1{font-family:var(--f-display);font-size:21px;margin:0;text-wrap:balance}
.phead .crumb{color:var(--muted);font-size:13px}
.actions{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.actions .dd>button.mb{background:none;border:0;padding:6px 9px;border-radius:6px;font-size:13px;font-weight:500;display:flex;gap:5px;align-items:center}
.actions .dd>button.mb:hover{background:var(--surface-2)}
.addc{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font-size:18px;line-height:1;display:grid;place-items:center}
.anl{background:var(--brand);color:var(--brand-ink);border:0;border-radius:7px;padding:5px 7px;display:grid;place-items:center}

/* summary strip */
.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px}
.stat{padding:11px 14px;display:flex;flex-direction:column;gap:3px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .v{font-size:17px;font-weight:500}
.stat .s{font-size:12px}

/* tabs */
.tabsWrap{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.tabsWrap .arr{border:0;background:var(--surface-2);padding:0 8px;color:var(--muted)}
.tabsWrap .arr:first-child{border-radius:10px 0 0 10px}.tabsWrap .arr:last-child{border-radius:0 10px 10px 0}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:0;border-right:1px solid var(--line);background:transparent;padding:9px 14px;font-size:13px;white-space:nowrap}
.tab code{font-family:var(--f-num);font-size:10px;border:1px solid var(--muted);padding:0 4px;border-radius:3px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.tab[aria-selected="true"] code{color:var(--brand-ink);border-color:var(--brand-muted)}
.tab .n{font-family:var(--f-num);font-size:11px;opacity:.65}

/* table */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.asearch{flex:0 1 280px;background:var(--surface)}
.tbox{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:62vh}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:8px 12px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;top:0;background:var(--surface);z-index:2;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);vertical-align:bottom}
thead th button{background:none;border:0;padding:0;font-weight:600;color:inherit;text-align:inherit;line-height:1.35}
thead th button[data-on]{color:var(--ink)}
thead th .sub2{color:var(--accent);font-weight:500}
.two{display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
.two small{font-size:11.5px;color:var(--muted)}
.two.q span{border-bottom:1px solid var(--line);padding-left:18px}
.two.q small{color:var(--accent)}
td .two small.gain,td .two small.loss,.two.gain small,.two.loss small{color:inherit}
tbody tr.row{border-bottom:1px solid var(--line)}
tbody tr.row:hover{background:var(--surface-2)}
tbody tr.row.open{background:var(--sel)}
tr.grp td{background:var(--surface-2);font-weight:600;border-bottom:1px solid var(--line)}
tr.grp button{background:none;border:0;padding:0;font-weight:600;display:flex;gap:8px;align-items:center}
.gcode{font-family:var(--f-num);font-size:10px;font-weight:500;border:1px solid var(--muted);padding:0 4px;border-radius:3px;color:var(--muted)}
.caret{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
[aria-expanded="true"] .caret{transform:rotate(90deg)}
.nm button{background:none;border:0;padding:0;display:flex;gap:6px;align-items:center;text-align:left}
.own{font-size:11px;color:var(--muted)}
.xp{display:inline-grid;place-items:center;width:16px;height:16px;font-size:10px;font-weight:700;color:var(--loss);border:1px solid currentColor;border-radius:3px}
tr.lot td{background:var(--bg);font-size:12.5px;color:var(--muted);border-bottom:1px dashed var(--line)}
tr.lot td:first-child{padding-left:42px}
tfoot td{position:sticky;bottom:0;background:var(--sel);font-weight:600;border-top:2px solid var(--sel-line)}
tfoot tr.chg td{bottom:auto;position:static;border-top:1px solid var(--sel-line);font-weight:500;font-size:12.5px}
.empty{padding:44px 16px;display:grid;place-items:center;gap:10px;color:var(--muted)}

/* analytics popover */
.anpanel{width:min(640px,calc(100vw - 32px));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:10px}
.acard{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;min-width:0;background:var(--surface);text-align:left;align-content:start;transition:border-color .15s,transform .15s}
.acard:hover{border-color:var(--accent);transform:translateY(-2px)}
/* hover preview: shown only while the pointer is over the icon or the cards */
.dd.hov>.hp{display:none}
.dd.hov:hover>.hp{display:grid}
.dd.hov>.hp::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px}
.anfull{display:grid;gap:14px;padding:18px}
.anfull .anpanel{width:auto;padding:0;grid-template-columns:repeat(3,minmax(0,1fr))}
.anfull table{min-width:520px}
.anfull th{position:static}
@media (max-width:980px){.anfull .anpanel{grid-template-columns:minmax(0,1fr)}}
.acard .go{font-size:12px;color:var(--accent);font-weight:600}
.acard h4{margin:0;font-family:var(--f-display);font-size:14px}
.acard svg{width:100%;height:auto;display:block}
.mini{font-size:11px;color:var(--muted);display:grid;gap:3px}
.mini span{display:flex;align-items:center;gap:6px;justify-content:space-between}
.mini i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

/* modals */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(5,20,16,.5)}
dialog.wide{width:min(1100px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog.small{width:min(520px,calc(100vw - 32px))}
.mhead{display:flex;align-items:stretch;border-bottom:1px solid var(--line);min-height:52px}
.mhead>*{display:flex;align-items:center;padding:0 18px;border-right:1px solid var(--line)}
.mhead .grow{flex:1}
.mhead .x{background:var(--brand);color:var(--brand-ink);border:0;padding:0 20px;font-size:20px;border-radius:0 12px 0 0;border-right:0}
.mhead button.tabb{background:none;border:0;border-right:1px solid var(--line);font-weight:600;position:relative}
.mhead button.tabb[aria-pressed="true"]{background:var(--surface-2)}
.badge{position:absolute;top:8px;right:6px;background:var(--loss);color:#fff;font-size:9px;font-weight:700;border-radius:999px;padding:1px 5px}
.mbody{display:grid;min-height:420px;max-height:calc(100vh - 140px);overflow:auto}
.dlg{padding:18px;display:grid;gap:12px}
.dlg h2{font-family:var(--f-display);margin:0;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-end{display:flex;justify-content:flex-end;gap:8px}
.err{color:var(--loss);font-size:12px;min-height:1em}

/* import */
.imp{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.imp .lst{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.imp .srch{background:var(--surface-2);padding:10px 14px}
.imp table{min-width:0}
.imp td,.imp th{padding:12px 14px}
.imp th{position:static;font-weight:500;font-size:11px}
.imp tr.trow{border-bottom:1px solid var(--line);cursor:pointer}
.imp tr.trow:hover,.imp tr.trow.on{background:var(--surface-2)}
.fmt{font-weight:600;font-size:12px}
.fmt.PDF{color:var(--loss)} .fmt.Excel{color:var(--gain)} .fmt.API,.fmt.CSV{color:var(--ink)}
.drop{margin:auto;width:min(340px,90%);border:2px dashed var(--brand-muted);border-radius:10px;padding:32px 18px;display:grid;justify-items:center;gap:12px;text-align:center;background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.rpane{display:flex;flex-direction:column;gap:12px;padding:20px;min-width:0}
.log{display:grid;gap:8px}
.log div{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;display:grid;gap:4px}
.imp.wide-r{grid-template-columns:minmax(0,.75fr) minmax(0,1.6fr)}
.star{background:none;border:0;font-size:17px;color:var(--sel-line);padding:2px 6px;line-height:1}
.wz{display:grid;gap:12px;align-content:start;min-width:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.steps>span{padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.steps>span.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.steps>span.done{background:var(--accent-soft);color:var(--accent)}
.st-chip{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.steps>.st-Mapped,.st-Mapped{background:color-mix(in srgb,var(--gain) 16%,transparent);color:var(--gain)}
.steps>.st-Map,.st-Map{background:var(--sel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--sel-line)}
.steps>.st-Fully,.st-Fully{background:var(--surface-2);color:var(--muted)}
.rv table{min-width:620px}.rv th{position:static}.rv td,.rv th{padding:7px 10px}
.rv tr.dup td:not(:first-child){color:var(--muted);text-decoration:line-through}
.vfilters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}

/* reports */
.rep{grid-template-columns:220px 260px minmax(0,1fr)}
.rep .cats{border-right:1px solid var(--line);padding:12px;display:grid;gap:8px;align-content:start;background:var(--surface-2)}
.rep .cats button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;text-align:left;font-weight:500}
.rep .cats button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.rep .rl{border-right:1px solid var(--line);display:flex;flex-direction:column}
.rep .rl button{background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;text-align:left;display:flex;justify-content:space-between;gap:8px}
.rep .rl button[aria-pressed="true"]{background:var(--sel)}
.rep .det{padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rep .det h3{margin:0;font-family:var(--f-display);font-size:19px;display:flex;justify-content:space-between;gap:10px}
.rep .det p,.rep .det ul{margin:0;line-height:1.55;max-width:62ch}
.rep .out{overflow:auto;border:1px solid var(--line);border-radius:8px}
.rep .out table{min-width:520px}
.rep .out th{position:static}
.colhead{padding:12px 16px;font-family:var(--f-display);font-weight:700;font-size:15px;border-bottom:1px solid var(--line)}

/* account */
.acct{display:grid;grid-template-columns:auto 1fr;gap:14px 26px;align-items:center;padding:6px 4px}
.acct dt{color:var(--muted)} .acct dd{margin:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}

@media (max-width:980px){
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{border-left:0;border-top:1px solid var(--line)}
  .stat:nth-child(-n+2){border-top:0}
  .stat:nth-child(even){border-left:1px solid var(--line)}
  .rep{grid-template-columns:minmax(0,1fr)}
  .rep .cats{display:flex;overflow-x:auto}
  .rep .cats button{flex:0 0 auto}
  .imp,.imp.wide-r{grid-template-columns:minmax(0,1fr)}
  .anpanel{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){

function stats(h){
  const qty=h.lots.reduce((s,l)=>s+l.q,0);
  const inv=h.lots.reduce((s,l)=>s+l.q*l.p,0);
  const ul=C[h.cls].ul;
  const cur=ul?h.ltp:qty*h.ltp;
  const today=ul?h.ltp-h.prev:qty*(h.ltp-h.prev);
  const prevVal=cur-today;
  return {qty,inv,avg:qty?inv/qty:0,cur,today,todayP:prevVal?today/prevVal*100:0,unrl:cur-inv,unrlP:inv?(cur-inv)/inv*100:0};
}
function tot(hs){return hs.reduce((a,h)=>{const s=stats(h);a.inv+=s.inv;a.cur+=s.cur;a.today+=s.today;return a},{inv:0,cur:0,today:0})}

// XIRR by Newton's method with a bisection fallback
function xirr(flows){
  if(flows.length<2)return NaN;
  flows=flows.slice().sort((a,b)=>a.d<b.d?-1:1);
  const t0=new Date(flows[0].d);
  const f=r=>flows.reduce((s,c)=>s+c.a/Math.pow(1+r,(new Date(c.d)-t0)/864e5/365),0);
  let r=0.1;
  for(let i=0;i<60;i++){
    const v=f(r),dv=(f(r+1e-6)-v)/1e-6;
    if(!isFinite(dv)||dv===0)break;
    const n=r-v/dv; if(Math.abs(n-r)<1e-8)return n; r=n;
    if(r<=-0.99)break;
  }
  let lo=-0.99,hi=10;
  if(f(lo)*f(hi)>0)return NaN;
  for(let i=0;i<200;i++){const m=(lo+hi)/2;(f(lo)*f(m)<=0)?hi=m:lo=m}
  return (lo+hi)/2;
}
function xirrOf(hs){
  const fl=hs.flatMap(h=>h.lots.map(l=>({d:l.d,a:-l.q*l.p})));
  if(!fl.length)return NaN;
  fl.push({d:TODAY,a:tot(hs).cur});
  return xirr(fl)*100;
}

function viewHoldings(){

  const m={};
  F.portfolios.forEach(p=>p.holdings.forEach(h=>{
    const k=h.cls+'|'+h.name;
    if(!m[k])m[k]={...h,lots:[],own:[]};
    m[k].lots.push(...h.lots.map(l=>({...l,who:p.name})));m[k].own.push(p.name);
  }));
  return Object.values(m);
}

function donut(parts,total,half){
  const r=40,cx=60,cy=half?58:60,L=Math.PI*r*(half?1:2);let off=0;
  const segs=parts.map(p=>{const len=p.v/total*L;const s=`<circle r="${r}" cx="${cx}" cy="${cy}" fill="none" stroke="${p.c}" stroke-width="16" stroke-dasharray="${len} ${2*Math.PI*r}" stroke-dashoffset="${-off}" transform="rotate(${half?180:-90} ${cx} ${cy})"/>`;off+=len;return s}).join('');
  return `<svg viewBox="0 0 120 ${half?70:120}" role="img"><circle r="${r}" cx="${cx}" cy="${cy}" fill="none" stroke="var(--surface-2)" stroke-width="16" ${half?`stroke-dasharray="${L} 999" transform="rotate(180 ${cx} ${cy})"`:''}/>${segs}</svg>`;
}
function analytics(all,T,xr){
  const by=CLASSES.map(c=>({c:c.c,n:c.n,v:all.filter(h=>h.cls===c.k).reduce((s,h)=>s+stats(h).cur,0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const eqParts=[
    {n:'Direct stocks',c:'#1f6f5c',v:all.filter(h=>h.cls==='EQ'&&h.sub!=='ETF').reduce((s,h)=>s+stats(h).cur,0)},
    {n:'ETFs',c:'#3a9bb0',v:all.filter(h=>h.cls==='EQ'&&h.sub==='ETF').reduce((s,h)=>s+stats(h).cur,0)},
    {n:'Equity mutual funds',c:'#d9603a',v:all.filter(h=>h.cls==='MFE').reduce((s,h)=>s+stats(h).cur,0)},
    {n:'SIF',c:'#a24d7a',v:all.filter(h=>h.cls==='SIF').reduce((s,h)=>s+stats(h).cur,0)},
  ].filter(x=>x.v>0);
  const eqT=eqParts.reduce((s,x)=>s+x.v,0);
  const nifty=11.2, mx=Math.max(Math.abs(xr)||0,nifty,1);
  const bar=(lab,v,c)=>`<div style="display:grid;gap:3px"><span style="display:flex;justify-content:space-between;gap:8px;font-size:11px"><span class="mut">${lab}</span><b class="num">${isFinite(v)?pct(v):'—'}</b></span><span style="height:9px;border-radius:4px;background:var(--surface-2);display:block"><span style="display:block;height:100%;width:${Math.max(2,Math.abs(v||0)/mx*100)}%;background:${c};border-radius:4px"></span></span></div>`;
  return `
    <button class="acard" data-anal="hold"><span class="label">Asset allocation</span>${by.length?donut(by,T.cur,true):''}<div class="mini">${by.slice(0,5).map(x=>`<span><span><i style="background:${x.c}"></i>${x.n}</span><b class="num">${(x.v/T.cur*100).toFixed(1)}%</b></span>`).join('')}</div><h4>Holdings</h4><span class="go">Open report →</span></button>
    <button class="acard" data-anal="perf"><span class="label">XIRR vs benchmark</span><div style="display:grid;gap:10px;padding-top:6px">${bar('This portfolio',xr,'var(--accent)')}${bar('Nifty 50 (same cash flows)',nifty,'var(--brand-muted)')}</div><p class="mut" style="font-size:11px;margin:0">Benchmark figure is a sample value.</p><h4>Performance</h4><span class="go">Open report →</span></button>
    <button class="acard" data-anal="eq"><span class="label">Equity exposure</span>${eqT?donut(eqParts,eqT,false):''}<div class="mini">${eqParts.map(x=>`<span><span><i style="background:${x.c}"></i>${x.n}</span><b class="num">${(x.v/eqT*100).toFixed(1)}%</b></span>`).join('')}</div><h4>Equity Exposure</h4><span class="go">Open report →</span></button>`;
}

function th(k,a,b){const on=st.sort.k===k;return `<th><button data-sort="${k}"${on?' data-on':''}>${a}${b?'<br><span class="'+(k==='qty'?'sub2':'')+'">'+b+'</span>':''}${on?(st.sort.d>0?' ↑':' ↓'):''}</button></th>`}
function two(v,p){return `<div class="two ${cls(v)}"><span class="num">${fmt(v)}</span><small class="num">${pct(p)}</small></div>`}
function table(all){
  const q=st.q.toLowerCase();
  let rows=all.filter(h=>(st.tab==='ALL'||h.cls===st.tab)&&(!q||h.name.toLowerCase().includes(q))).map(h=>({h,s:stats(h)}));
  if(!rows.length)return `<div class="empty">${st.q?'No assets match that search.':'Nothing in '+(st.tab==='ALL'?'this portfolio':C[st.tab].n)+' yet.'}<button class="addp" data-open="tx"><span class="plus">+</span>Add a transaction</button></div>`;
  const key={name:r=>r.h.name.toLowerCase(),qty:r=>r.s.qty,inv:r=>r.s.inv,ltp:r=>r.h.ltp,today:r=>r.s.today,unrl:r=>r.s.unrl,cur:r=>r.s.cur}[st.sort.k];
  rows.sort((a,b)=>{const x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*st.sort.d});
  let body='';const T={inv:0,cur:0,today:0};
  CLASSES.filter(c=>rows.some(r=>r.h.cls===c.k)).forEach(c=>{
    const gr=rows.filter(r=>r.h.cls===c.k), g=tot(gr.map(r=>r.h));
    T.inv+=g.inv;T.cur+=g.cur;T.today+=g.today;
    const closed=st.closed[c.k];
    body+=`<tr class="grp"><td><button data-grp="${c.k}" aria-expanded="${!closed}"><span class="caret">▸</span><code class="gcode">${c.code||c.k}</code>${c.n} <span class="chip">${gr.length}</span></button></td><td></td>
      <td class="num">${fmt(g.inv)}</td><td></td><td>${two(g.today,g.today/(g.cur-g.today)*100)}</td><td>${two(g.cur-g.inv,(g.cur-g.inv)/g.inv*100)}</td><td class="num">${fmt(g.cur)}</td></tr>`;
    if(closed)return;
    gr.forEach(({h,s})=>{
      const id=h.cls+'|'+h.name, open=st.open[id], ul=C[h.cls].ul;
      body+=`<tr class="row${open?' open':''}"><td><div class="nm"><button data-row="${esc(id)}" aria-expanded="${!!open}"><span class="caret">▸</span><span>${esc(h.name)}${h.own&&h.own.length>1?` <span class="own">· ${h.own.length} members</span>`:h.own?` <span class="own">· ${esc(h.own[0])}</span>`:''}</span></button></div></td>
        <td>${ul?'<span class="mut">—</span>':`<div class="two q"><span class="num">${fmt(s.qty,s.qty%1?3:0)}</span><small class="num">${fmt(s.avg)}</small></div>`}</td>
        <td class="num">${fmt(s.inv)}</td><td class="num">${ul?'—':fmt(h.ltp)}</td>
        <td>${two(s.today,s.todayP)}</td><td>${two(s.unrl,s.unrlP)}</td><td class="num">${fmt(s.cur)}</td></tr>`;
      if(open)h.lots.slice().sort((a,b)=>a.d<b.d?-1:1).forEach(l=>{
        const d=days(l.d,TODAY), lt=d>(C[h.cls].eq?365:730);
        body+=`<tr class="lot"><td>${dmy(l.d)}${l.who?' · '+esc(l.who):''} · ${lt?'Long term':'Short term'} (${d} days)</td><td class="num">${ul?'—':fmt(l.q,l.q%1?3:0)}</td><td class="num">${fmt(l.q*l.p)}</td><td class="num">${ul?'':'@ '+fmt(l.p)}</td><td></td><td></td><td></td></tr>`;
      });
    });
  });
  return `<table><thead><tr>${th('name','Asset')}${th('qty','Qty.','Avg. pur. price')}${th('inv','Amt.','Invested')}${th('ltp','Current','Price')}${th('today',"Today's",'Gain')}${th('unrl','Unrealised','Gain')}${th('cur','Current','Value')}</tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td>NET WORTH</td><td></td><td class="num">${fmt(T.inv)}</td><td></td><td>${two(T.today,T.today/(T.cur-T.today)*100)}</td><td>${two(T.cur-T.inv,(T.cur-T.inv)/T.inv*100)}</td><td class="num">${fmt(T.cur)}</td></tr></tfoot></table>`;
}

  $('#txList').innerHTML=p.holdings.filter(h=>h.cls===$('#txC').value).map(h=>`<option value="${esc(h.name)}">`).join('');
}
function saveTx(){
  const p=fam().portfolios.find(p=>p.id===$('#txP').value), c=$('#txC').value, ul=C[c].ul;
  const name=$('#txN').value.trim(), q=ul?1:+$('#txQ').value, r=+$('#txR').value, d=$('#txD').value, ltp=$('#txL').value, sell=$('#txT').value==='sell';
  const err=m=>{$('#txErr').textContent=m};
  if(!name)return err('Enter the asset name.');
  if(!(q>0))return err('Enter a quantity above zero.');
  if(!(r>0))return err(ul?'Enter the amount.':'Enter the price per unit.');
  if(!d)return err('Pick the transaction date.');
  let h=p.holdings.find(x=>x.cls===c&&x.name.toLowerCase()===name.toLowerCase());
  if(sell){
    if(!h)return err('There is no holding with that name to sell.');
    if(ul){ // withdraw an amount from a deposit-type holding
      if(r>h.ltp+1e-6)return err('Value is only ₹'+fmt(h.ltp)+'.');
      const share=r/h.ltp; h.lots.forEach(l=>l.p*=1-share); h.ltp-=r; h.prev-=r;
      if(h.ltp<1)p.holdings.splice(p.holdings.indexOf(h),1);
    }else{
      const have=h.lots.reduce((s,l)=>s+l.q,0);
      if(q>have+1e-9)return err('You hold only '+fmt(have,3)+' units.');
      // FIFO: oldest lots go first
      let left=q;h.lots.sort((a,b)=>a.d<b.d?-1:1);
      while(left>1e-9&&h.lots.length){const l=h.lots[0];if(l.q<=left+1e-9){left-=l.q;h.lots.shift()}else{l.q-=left;left=0}}
      if(!h.lots.length)p.holdings.splice(p.holdings.indexOf(h),1);else if(ltp)h.ltp=+ltp;
    }
    save();M.close();st.pid=p.id;render();toast(ul?'Withdrawal recorded':'Sale recorded against oldest lots first');return;
  }
  if(!h){const cur=ltp?+ltp:r;h={cls:c,name,ltp:cur,prev:cur,lots:[]};p.holdings.push(h)}
  else if(ltp)h.ltp=+ltp;
  else if(ul){h.ltp+=r;h.prev+=r}
  h.lots.push({d,q,p:r});
  save();M.close();st.pid=p.id;render();toast('Saved to '+p.name);
}

  const F=fam(), pn=st.pid==='__all'?'Family Group':(F.portfolios.find(p=>p.id===st.pid)||{}).name, f=st.vf;
  M.innerHTML=head(`<div class="grow" style="font-family:var(--f-display);font-weight:700;font-size:17px">All Transactions</div>`,
    `<div class="mut" style="font-size:13px">Portfolio: <b style="color:var(--ink);margin-left:4px">${esc(pn)}</b></div>`)+
  `<div class="mbody"><div class="anfull">
    <div class="vfilters">
      <label class="field">Asset class<select id="vfC"><option value="">All</option>${CLASSES.map(c=>`<option value="${c.k}"${f.cls===c.k?' selected':''}>${c.n}</option>`).join('')}</select></label>
      <label class="field">From<input type="date" id="vfF" value="${f.from}"></label>
      <label class="field">To<input type="date" id="vfT" value="${f.to}"></label>
      <label class="field" style="flex:1;min-width:160px">Asset<input id="vfQ" placeholder="Search by name" value="${esc(f.q)}"></label>
      <button class="btn" data-vfclear>Clear filters</button>
      <button class="btn primary" data-txcsv>Export to CSV</button>
    </div>
    <div class="tbox" id="vtTable" style="max-height:55vh">${txnTable()}</div>
  </div></div>`;
}

/* reports */
const REPORTS={
  'Prime':[
    {n:'Advanced Performance Review',lock:1,d:'Full performance pack for a portfolio or the whole family.',b:['XIRR by asset class and category','XIRR against Nifty 50, Sensex or a custom blend','Any date range you choose']},
    {n:'AIF / PMS Investment Review',lock:1,d:'Review of alternative investment funds and PMS holdings with fees and benchmark.',b:[]}],
  'Performance':[
    {n:'XIRR by asset class',run:'xirr',d:'Annualised return of each asset class since its first investment, worked out from every purchase date.',b:[]},
    {n:'Holdings as on date',run:'hold',d:'Every holding with quantity, cost, value and gain as of today.',b:[]},
    {n:'Equity exposure',run:'eq',d:'How your equity money is split between direct stocks, ETFs, equity mutual funds and SIFs.',b:[]}],
  'Capital Gains':[
    {n:'Unrealised gains: short vs long term',run:'stlt',d:'Splits each purchase into short or long term by how long it has been held. Equity and equity funds become long term after 12 months, others after 24.',b:['Use it to plan sales before 31 March','Equity long-term gains up to ₹1.25 lakh a year are tax-free']},
    {n:'Realised capital gains (FIFO)',lock:1,d:'Gains on everything sold in a financial year, matched oldest-first, with 31-Jan-2018 grandfathering for equity.',b:[]}],
  'Transactions':[
    {n:'Stock Transactions',run:'stx',period:1,d:'Every stock and ETF purchase in the period you choose, with quantity, price and amount.',b:[]},
    {n:'All Transactions',run:'txn',d:'Every purchase and deposit across all asset classes, newest first.',b:[]}],
  'Income':[
    {n:'Dividend & interest',lock:1,d:'Dividends, FD and bond interest by financial year, with TDS.',b:[]}],
  'Tax Software Formats':[
    {n:'ITR Schedule 112A (CSV)',lock:1,d:'Long-term equity gains in the exact column layout the income tax utility accepts.',b:[]},
    {n:'Schedule CG summary',lock:1,d:'Short and long term gains grouped the way the ITR form asks.',b:[]}],
};
const PER={'All dates':['0000','9999'],'FY 2026-27':['2026-04-01','2027-03-31'],'FY 2025-26':['2025-04-01','2026-03-31'],'FY 2024-25':['2024-04-01','2025-03-31'],'FY 2023-24':['2023-04-01','2024-03-31'],'FY 2022-23':['2022-04-01','2023-03-31']};
function mReports(out){
  const F=fam(), list=REPORTS[st.rcat];
  if(!st.rep||!list.some(r=>r.n===st.rep))st.rep=list[0].n;
  const R=list.find(r=>r.n===st.rep);
  const pn=st.pid==='__all'?'Family Group':(F.portfolios.find(p=>p.id===st.pid)||{}).name;
  M.innerHTML=head(`<div class="grow" style="font-family:var(--f-display);font-weight:700;font-size:17px">FolioLense Reports</div>`,
    `<div class="mut" style="font-size:13px">Family: <b style="color:var(--ink);margin-left:4px">${esc(F.name)}</b></div><div class="mut" style="font-size:13px">Portfolio: <b style="color:var(--ink);margin-left:4px">${esc(pn)}</b></div>`)+
  `<div class="mbody rep">
    <div class="cats">${Object.keys(REPORTS).map(k=>`<button data-rcat="${k}" aria-pressed="${k===st.rcat}">${k}</button>`).join('')}</div>
    <div class="rl"><div class="colhead">${st.rcat}</div>${list.map(r=>`<button data-rep="${esc(r.n)}" aria-pressed="${r.n===st.rep}"><span>${r.n}</span>${r.lock?'<span title="Premium" class="mut">🔒</span>':''}</button>`).join('')}</div>
    <div class="det"><h3><span>${R.n}</span>${R.lock?'<span class="chip">Premium</span>':''}</h3>
      ${R.period?`<label class="field" style="max-width:240px">Period<select id="repPeriod">${Object.keys(PER).map(k=>`<option${k===st.rper?' selected':''}>${k}</option>`).join('')}</select></label>`:''}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn dark" data-gen>${R.run?'Generate Report':'Preview not in prototype'}</button>${out?'<button class="btn primary" data-repcsv>Export to CSV</button>':''}</div>
      <p>${R.d}</p>${R.b.length?`<ul>${R.b.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
      ${out?`<div class="out">${out}</div>`:''}
    </div></div>`;
}
function runReport(){
  const R=REPORTS[st.rcat].find(r=>r.n===st.rep);
  if(!R.run){toast(R.n+' · not in this prototype');return}
  const all=viewHoldings();let html='';
  if(R.run==='xirr'){
    html=`<table><thead><tr><th>Asset class</th><th>Invested</th><th>Current value</th><th>Gain</th><th>XIRR</th></tr></thead><tbody>`+
      CLASSES.map(c=>({c,hs:all.filter(h=>h.cls===c.k)})).filter(r=>r.hs.length).map(r=>{const t=tot(r.hs),x=xirrOf(r.hs);return `<tr class="row"><td>${r.c.n}</td><td class="num">${fmt(t.inv)}</td><td class="num">${fmt(t.cur)}</td><td class="num ${cls(t.cur-t.inv)}">${fmt(t.cur-t.inv)}</td><td class="num ${cls(x)}">${isFinite(x)?pct(x):'—'}</td></tr>`}).join('')+`</tbody></table>`;
  }else if(R.run==='hold'){
    html=`<table><thead><tr><th>Asset</th><th>Class</th><th>Qty</th><th>Cost</th><th>Value</th><th>Gain %</th></tr></thead><tbody>`+
      all.map(h=>({h,s:stats(h)})).sort((a,b)=>b.s.cur-a.s.cur).map(({h,s})=>`<tr class="row"><td>${esc(h.name)}</td><td>${C[h.cls].code||h.cls}</td><td class="num">${C[h.cls].ul?'—':fmt(s.qty,s.qty%1?3:0)}</td><td class="num">${fmt(s.inv)}</td><td class="num">${fmt(s.cur)}</td><td class="num ${cls(s.unrlP)}">${pct(s.unrlP)}</td></tr>`).join('')+`</tbody></table>`;
  }else if(R.run==='eq'){
    const parts=[['Direct stocks',h=>h.cls==='EQ'&&h.sub!=='ETF'],['ETFs',h=>h.cls==='EQ'&&h.sub==='ETF'],['Equity mutual funds',h=>h.cls==='MFE'],['SIF',h=>h.cls==='SIF']].map(([n,f])=>{const hs=all.filter(f);return {n,hs,t:tot(hs)}}).filter(p=>p.hs.length);
    const E=parts.reduce((s,p)=>s+p.t.cur,0);
    html=`<table><thead><tr><th>Equity route</th><th>Holdings</th><th>Invested</th><th>Current value</th><th>Share of equity</th></tr></thead><tbody>`+parts.map(p=>`<tr class="row"><td>${p.n}</td><td class="num">${p.hs.length}</td><td class="num">${fmt(p.t.inv)}</td><td class="num">${fmt(p.t.cur)}</td><td class="num">${(p.t.cur/E*100).toFixed(1)}%</td></tr>`).join('')+
      `</tbody><tfoot><tr><td>Total equity</td><td></td><td class="num">${fmt(parts.reduce((s,p)=>s+p.t.inv,0))}</td><td class="num">${fmt(E)}</td><td class="num">100%</td></tr></tfoot></table>`;
  }else if(R.run==='stlt'){
    let ST=0,LT=0;
    const rows=all.filter(h=>!C[h.cls].ul).map(h=>{let st_=0,lt_=0;h.lots.forEach(l=>{const g=l.q*(h.ltp-l.p);(days(l.d,TODAY)>(C[h.cls].eq?365:730))?lt_+=g:st_+=g});ST+=st_;LT+=lt_;return {h,st_,lt_}}).filter(r=>r.st_||r.lt_);
    html=`<table><thead><tr><th>Asset</th><th>Short-term gain</th><th>Long-term gain</th></tr></thead><tbody>`+rows.map(r=>`<tr class="row"><td>${esc(r.h.name)}</td><td class="num ${cls(r.st_)}">${fmt(r.st_)}</td><td class="num ${cls(r.lt_)}">${fmt(r.lt_)}</td></tr>`).join('')+
      `</tbody><tfoot><tr><td>Total</td><td class="num ${cls(ST)}">${fmt(ST)}</td><td class="num ${cls(LT)}">${fmt(LT)}</td></tr></tfoot></table>`;
  }else if(R.run==='stx'){
    const [a,z]=PER[st.rper];
    const tx=all.filter(h=>h.cls==='EQ').flatMap(h=>h.lots.map(l=>({...l,h}))).filter(t=>t.d>=a&&t.d<=z).sort((x,y)=>x.d<y.d?1:-1);
    const T=tx.reduce((s,t)=>s+t.q*t.p,0);
    html=tx.length?`<table><thead><tr><th>Date</th><th>Stock / ETF</th><th>Portfolio</th><th>Type</th><th>Qty</th><th>Price</th><th>Amount</th></tr></thead><tbody>`+tx.map(t=>`<tr class="row"><td>${dmy(t.d)}</td><td>${esc(t.h.name)}</td><td>${esc(t.who||(fam().portfolios.find(p=>p.id===st.pid)||{}).name||'')}</td><td>Buy</td><td class="num">${fmt(t.q,t.q%1?3:0)}</td><td class="num">${fmt(t.p)}</td><td class="num">${fmt(t.q*t.p)}</td></tr>`).join('')+`</tbody><tfoot><tr><td>${tx.length} transactions</td><td></td><td></td><td></td><td></td><td></td><td class="num">${fmt(T)}</td></tr></tfoot></table>`
      :`<div class="empty">No stock transactions in ${st.rper}.</div>`;
  }else if(R.run==='txn'){
    const tx=all.flatMap(h=>h.lots.map(l=>({...l,h}))).sort((a,b)=>a.d<b.d?1:-1);
    html=`<table><thead><tr><th>Date</th><th>Asset</th><th>Portfolio</th><th>Qty</th><th>Price</th><th>Amount</th></tr></thead><tbody>`+tx.map(t=>`<tr class="row"><td>${dmy(t.d)}</td><td>${esc(t.h.name)}</td><td>${esc(t.who||(fam().portfolios.find(p=>p.id===st.pid)||{}).name||'')}</td><td class="num">${C[t.h.cls].ul?'—':fmt(t.q,t.q%1?3:0)}</td><td class="num">${C[t.h.cls].ul?'—':fmt(t.p)}</td><td class="num">${fmt(t.q*t.p)}</td></tr>`).join('')+`</tbody></table>`;
  }
  mReports(html);
}

/* ---------- events ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}
function closeDD(except){document.querySelectorAll('.panel:not(.hp)').forEach(p=>{if(p!==except)p.hidden=true})}

document.addEventListener('click',e=>{
  const b=e.target.closest('button,tr[data-tpl]');
  if(!b){if(!e.target.closest('.panel'))closeDD();return}
  if(b.dataset.dd||b.dataset.dd2){
    const id=b.dataset.dd||b.dataset.dd2;
    if(b.dataset.dd2&&st.book==='fno'){st.book='inv';render()}
    const p=$('#dd-'+id);if(!p)return;
    if(id==='fam')renderFamPanel();
    // hover menus: a click always opens (touch screens have no hover)
    const show=b.closest('.hov')&&b.dataset.dd?true:p.hidden;closeDD();p.hidden=!show;return;
  }
  if(b.dataset.anal){
    closeDD();st.rcat='Performance';
    st.rep={hold:'Holdings as on date',perf:'XIRR by asset class',eq:'Equity exposure'}[b.dataset.anal];
    openModal('reports');runReport();return;
  }
  if(!b.closest('.panel')||b.dataset.soon||b.dataset.open||b.dataset.go||b.dataset.period)closeDD();
  if(b.dataset.soon){toast(b.dataset.soon+' · not in this prototype');return}
  if(b.dataset.open){openModal(b.dataset.open);return}
  if('close' in b.dataset){M.close();return}
  if(b.dataset.go){const [f,p]=b.dataset.go.split('|');st.fam=f;st.pid=p;st.fid=null;st.book='inv';st.open={};render();return}
  if(b.dataset.p){st.pid=b.dataset.p;st.open={};render();return}
  if(b.dataset.fid){st.fid=b.dataset.fid;render();return}
  if(b.dataset.tab){st.tab=b.dataset.tab;renderMain();return}
  if(b.dataset.ftab){st.ftab=b.dataset.ftab;renderMain();return}
  if(b.dataset.period){st.period=b.dataset.period;renderMain();return}
  if(b.dataset.scroll){$('#tabs').scrollBy({left:+b.dataset.scroll*320,behavior:'smooth'});return}
  if(b.dataset.sort){const k=b.dataset.sort;st.sort=st.sort.k===k?{k,d:-st.sort.d}:{k,d:k==='name'?1:-1};renderMain();return}
  if(b.dataset.grp){st.closed[b.dataset.grp]=!st.closed[b.dataset.grp];renderMain();return}
  if(b.dataset.row){st.open[b.dataset.row]=!st.open[b.dataset.row];renderMain();return}
  if(b.dataset.fav){const n=b.dataset.fav,i=db.favs.indexOf(n);i<0?db.favs.push(n):db.favs.splice(i,1);save();toast(i<0?'Added to favourites':'Removed from favourites');mImport();return}
  if(b.dataset.tview){st.tview=b.dataset.tview;mImport();return}
  if(b.dataset.imp){st.imp=b.dataset.imp;if(st.wiz&&st.wiz.step==='done')st.wiz=null;mImport();return}
  if(b.dataset.tpl){if(st.wiz&&st.wiz.step!=='done'){toast('Finish or cancel the current import first');return}st.wiz=null;st.tpl=b.dataset.tpl;mImport();return}
  if(b.dataset.pend){const l=db.log[+b.dataset.pend];startWiz(l.f,l.t,+b.dataset.pend);return}
  if('wzcancel' in b.dataset){st.wiz=null;mImport();return}
  if('wzback' in b.dataset){const w=st.wiz,s=wizSteps(w),i=s.findIndex(x=>x[0]===w.step);w.step=s[Math.max(0,i-1)][0];mImport();return}
  if('addbroker' in b.dataset){const n=$('#newBr');n.hidden=false;$('#wzNewB').focus();return}
  if('savebroker' in b.dataset){const v=$('#wzNewB').value.trim();if(!v)return;if(!db.brokers.includes(v))db.brokers.push(v);st.wiz.broker=v;save();mImport();toast('Broker added');return}
  if('backp' in b.dataset){const w=st.wiz,fno=TPL(w.tpl).t==='F&O';st.fam=w.fam;if(fno){st.book='fno';st.fid=w.pid}else{st.book='inv';st.pid=w.pid}st.wiz=null;M.close();render();return}
  if('txcsv' in b.dataset){const pn=st.pid==='__all'?'family':((fam().portfolios.find(p=>p.id===st.pid)||{}).name||'portfolio');saveCSV('transactions-'+pn.replace(/\W+/g,'-').toLowerCase()+'.csv',[['Date','Portfolio','Asset class','Asset','Type','Qty','Price','Amount'],...txnRows().map(t=>{const ul=C[t.h.cls].ul;return [t.d,t.who||'',C[t.h.cls].n,t.h.name,ul?'Deposit':'Buy',ul?'':t.q,ul?'':t.p,(t.q*t.p).toFixed(2)]})]);return}
  if('vfclear' in b.dataset){st.vf={cls:'',from:'',to:'',q:''};mTxns();return}
  if('repcsv' in b.dataset){const t=$('#modal .out table');if(t)saveCSV(st.rep.replace(/\W+/g,'-').toLowerCase()+'.csv',tableCSV(t));return}
  if(b.dataset.rcat){st.rcat=b.dataset.rcat;st.rep=null;mReports();return}
  if(b.dataset.rep){st.rep=b.dataset.rep;mReports();return}
  if('gen' in b.dataset){runReport();return}
  if(b.id==='bInv'||b.id==='bFno'){st.book=b.id==='bInv'?'inv':'fno';render();return}
  if(b.id==='focusSearch'){$('#aq').focus();return}
  if(b.id==='addFamBtn'){const f=$('#addFamForm');f.hidden=false;$('#newFam').focus();return}
  if(b.id==='reset'){db=seed();save();st.fam=db.families[0].id;st.pid='__all';st.fid=null;render();toast('Sample data restored');return}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='txForm')saveTx();
  if(['wzPw','wzMap','wzBr'].includes(e.target.id))wizNext();
  if(e.target.id==='wzRev')confirmImport();
  if(e.target.id==='addFamForm'){const n=$('#newFam').value.trim();if(!n)return;const f={id:'f'+uid(),name:n,recent:[],portfolios:[],fno:[]};db.families.push(f);save();st.fam=f.id;st.pid='__all';closeDD();render();toast('Family "'+n+'" added. Now add a portfolio.')}
  if(e.target.id==='addpForm'){
    const n=$('#apN').value.trim(),bk=$('#apB').value,t=$('#apT').value,F=fam();
    if(!n){$('#apErr').textContent='Enter a portfolio name.';return}
    if(bk==='fno'){const p={id:'q'+uid(),name:n,charges:{},trades:[]};F.fno.push(p);st.book='fno';st.fid=p.id}
    else{const p={id:'p'+uid(),name:n,type:t,holdings:[]};F.portfolios.push(p);st.book='inv';st.pid=p.id}
    save();M.close();render();toast('Portfolio "'+n+'" added');
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='txC'||e.target.id==='txP')syncTx();
  if(e.target.id==='ptype'){st.ptype=e.target.value;renderRail()}
  if(e.target.id==='file'&&e.target.files.length)addFiles(e.target.files);
  if(e.target.id==='wzFam'){const w=st.wiz;w.fam=e.target.value;const F=db.families.find(f=>f.id===w.fam);w.pid=((TPL(w.tpl).t==='F&O'?F.fno:F.portfolios)[0]||{}).id;mImport()}
  if(e.target.dataset&&e.target.dataset.maprow){st.wiz.rows[+e.target.dataset.maprow].mapTo=e.target.value}
  if(['vfC','vfF','vfT'].includes(e.target.id)){st.vf[{vfC:'cls',vfF:'from',vfT:'to'}[e.target.id]]=e.target.value;$('#vtTable').innerHTML=txnTable()}
  if(e.target.id==='repPeriod')st.rper=e.target.value;
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  const keep=fn=>{const pos=e.target.selectionStart;fn();const i=$('#'+id);if(i){i.focus();i.setSelectionRange(pos,pos)}};
  if(id==='aq'){st.q=e.target.value;keep(renderMain)}
  if(id==='gsearch'){st.gq=e.target.value;renderRail()}
  if(id==='famq')keep(renderFamPanel);
  if(id==='tplq')keep(mImport);
  if(id==='vfQ'){st.vf.q=e.target.value;$('#vtTable').innerHTML=txnTable()}
});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();addFiles(e.dataTransfer.files)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDD()});
M.addEventListener('click',e=>{if(e.target===M)M.close()});

render();
</script>
